services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    volumes:
      - ./backend:/app:Z
      - gomod:/go/pkg/mod

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      VITE_PROXY_TARGET: http://backend:8080
    ports: !override
      - "5173:5173"
    volumes:
      - ./frontend:/app:z
      - /app/node_modules

volumes:
  gomod:
